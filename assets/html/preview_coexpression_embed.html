<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TE-Dee Co-expression Graph Embed</title>
  <script src="../js/tekg_paths.php"></script>
  <script src="../vendor/g6/g6.min.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #ffffff 0%, #f6faff 100%);
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script>
    function loadVersionedScripts(sources) {
      const version = new URL(window.location.href).searchParams.get('v') || '';
      const suffix = version ? `?v=${encodeURIComponent(version)}` : '';
      return sources.reduce((chain, source) => chain.then(() => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = source + suffix;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Unable to load ${source}`));
        document.body.appendChild(script);
      })), Promise.resolve());
    }

    loadVersionedScripts([
      '../js/renderers/g6/index-g6-type-meta.js',
      '../js/renderers/g6/g6-svg-export.js',
      '../js/renderers/g6/coexpression/coexpression-contract.js',
      '../js/renderers/g6/coexpression/coexpression-dynamic-adapter.js',
      '../js/renderers/g6/coexpression/coexpression-renderer.js',
      '../js/renderers/g6/coexpression/coexpression-embed.js',
    ]).catch((error) => {
      console.error('Co-expression iframe scripts failed to load.', error);
    });
  </script>
</body>
</html>
