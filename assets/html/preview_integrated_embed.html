<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Integrated Graph</title>
  <style>html,body,#container{width:100%;height:100%;margin:0;overflow:hidden;background:#f8fafc}</style>
</head>
<body>
  <div id="container"></div>
  <script src="../js/tekg_paths.php"></script>
  <script src="../vendor/g6/g6.min.js"></script>
  <script>
    function loadVersionedScripts(sources) {
      const version = new URL(window.location.href).searchParams.get('v') || '';
      const suffix = version ? '?v=' + encodeURIComponent(version) : '';
      return sources.reduce(function (chain, source) {
        return chain.then(function () {
          return new Promise(function (resolve, reject) {
            const script = document.createElement('script');
            script.src = source + suffix;
            script.onload = resolve;
            script.onerror = function () { reject(new Error('Unable to load ' + source)); };
            document.body.appendChild(script);
          });
        });
      }, Promise.resolve());
    }
    loadVersionedScripts([
      '../js/renderers/g6/index-g6-type-meta.js',
      '../js/renderers/g6/g6-svg-export.js',
      '../js/renderers/g6/coexpression/coexpression-dynamic-adapter.js',
      '../js/renderers/g6/coexpression/coexpression-renderer.js',
      '../js/renderers/g6/integrated/integrated-contract.js',
      '../js/renderers/g6/integrated/integrated-adapter.js',
      '../js/renderers/g6/integrated/integrated-embed.js'
    ]).catch(function (error) { console.error('Integrated Graph iframe scripts failed to load.', error); });
  </script>
</body>
</html>
