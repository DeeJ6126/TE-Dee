[program:tekg-php84-fpm]
command=/data/tekg/runtime/php84/sbin/php-fpm --nodaemonize --fpm-config /app/tekg/shared/config/php84/php-fpm.conf
directory=/app/tekg/app
user=tekg_ro
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/app/tekg/shared/logs/php84/supervisor.log
stderr_logfile=/app/tekg/shared/logs/php84/supervisor.err
environment=PHPRC="/app/tekg/shared/config/php84/php.ini",PHP_INI_SCAN_DIR="/app/tekg/shared/config/php84/conf.d",HTTP_PROXY="http://127.0.0.1:17890",HTTPS_PROXY="http://127.0.0.1:17890",http_proxy="http://127.0.0.1:17890",https_proxy="http://127.0.0.1:17890",NO_PROXY="127.0.0.1,localhost",no_proxy="127.0.0.1,localhost"
