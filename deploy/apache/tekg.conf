RedirectMatch 301 ^/TE-$ /tedee/
RedirectMatch 301 ^/TE-/(.*)$ /tedee/$1
RedirectMatch 301 ^/tedee$ /tedee/

Alias /tedee/ "/app/tekg/app/"

<Directory "/app/tekg/app/">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9084"
    </FilesMatch>

    <FilesMatch "(^\.|^config\.local\.php$)">
        Require all denied
    </FilesMatch>
</Directory>

<LocationMatch "^/tedee/(?:[^/]+/)*\.">
    Require all denied
</LocationMatch>
